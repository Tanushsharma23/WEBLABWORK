<!DOCTYPE html>
<html>
    <head>
        <title> Admission form</title>

    <body>
        <form action="https://youtu.be/_nWlnl1uc-Q?si=yWbhO8_2B73JPhVq">
            <h1> REGISTRATION FORM</h1>

        NAME:<input type="text"reguired><br><br>
         PARENTAGE:<input type="text"optional><br><br>

         GENDER:
         <input type="radio" name="g">Male
         <input type="radio" name="g">Female <br><br>

         </select><br><br>

         <input type="submit" value="Submit">
        </form>
